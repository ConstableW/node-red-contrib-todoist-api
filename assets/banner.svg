<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-labelledby="t d">
  <title id="t">Todoist for Node-RED</title>
  <desc id="d">Banner: a Node-RED flow of three connected nodes ending in a Todoist-style checkmark</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b2b2f"/>
      <stop offset="1" stop-color="#17171a"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="320" rx="24" fill="url(#bg)"/>

  <!-- wires -->
  <g fill="none" stroke="#8a8a93" stroke-width="3" stroke-linecap="round">
    <path d="M300 118 C350 118 340 200 390 200"/>
    <path d="M530 200 C580 200 570 118 620 118"/>
    <path d="M760 118 C810 118 800 160 850 160"/>
  </g>

  <!-- node 1: inject -->
  <g>
    <rect x="160" y="92" width="140" height="52" rx="8" fill="#a6bbcf" stroke="#6f8196" stroke-width="2"/>
    <text x="230" y="124" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#1d2630">inject</text>
    <rect x="296" y="112" width="10" height="12" rx="2" fill="#8a8a93"/>
  </g>
  <!-- node 2: todoist -->
  <g>
    <rect x="390" y="174" width="140" height="52" rx="8" fill="#e44332" stroke="#a82e20" stroke-width="2"/>
    <text x="460" y="206" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#fff">get tasks</text>
    <rect x="384" y="194" width="10" height="12" rx="2" fill="#8a8a93"/>
    <rect x="526" y="194" width="10" height="12" rx="2" fill="#8a8a93"/>
  </g>
  <!-- node 3: todoist -->
  <g>
    <rect x="620" y="92" width="140" height="52" rx="8" fill="#e44332" stroke="#a82e20" stroke-width="2"/>
    <text x="690" y="124" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#fff">create task</text>
    <rect x="614" y="112" width="10" height="12" rx="2" fill="#8a8a93"/>
    <rect x="756" y="112" width="10" height="12" rx="2" fill="#8a8a93"/>
  </g>
  <!-- node 4: debug -->
  <g>
    <rect x="850" y="134" width="140" height="52" rx="8" fill="#87a980" stroke="#5d7d56" stroke-width="2"/>
    <text x="920" y="166" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#12200f">debug</text>
    <rect x="844" y="154" width="10" height="12" rx="2" fill="#8a8a93"/>
  </g>

  <!-- checkmark badge -->
  <circle cx="1080" cy="160" r="56" fill="#e44332"/>
  <path d="M1052 162 L1073 184 L1110 138" fill="none" stroke="#fff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- title -->
  <text x="160" y="270" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="40" font-weight="700" fill="#fff">Todoist <tspan fill="#e44332">API v1</tspan> for Node-RED</text>
  <text x="160" y="300" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#a0a0a8">node-red-contrib-todoist-api · maintained fork</text>
</svg>
